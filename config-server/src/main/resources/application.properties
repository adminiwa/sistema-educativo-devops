spring.application.name=config-server
server.port=8888

# Configuración del repositorio Git para las configuraciones
spring.cloud.config.server.git.uri=https://github.com/tu-usuario/sistema-educativo-configs.git
# O utilizar una carpeta local
# spring.cloud.config.server.native.search-locations=file:./config-repo
# spring.profiles.active=native

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Información de la aplicación
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Servidor de configuración centralizada
info.app.version=1.0.0