# Nombre del servicio
spring.application.name=matriculas-servicio

# Puerto del servicio
server.port=8083

# Configuración de MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/matriculas_db

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Configuración de timeouts para Feign
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.circuitbreaker.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Servicio de gestión de matrículas
info.app.version=1.0.0

spring.config.import=optional:configserver:http://config-server:8888

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.usuarioService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.usuarioService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.usuarioService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.usuarioService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.usuarioService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.usuarioService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.asignaturaService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.asignaturaService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.asignaturaService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.asignaturaService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.asignaturaService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.asignaturaService.permittedNumberOfCallsInHalfOpenState=3